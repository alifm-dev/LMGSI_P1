<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Cerca pel·lícules i descobreix els seus títols i resultats a The Movie Database."
    />

    <link rel="icon" type="image/png" href="./images/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/estils.css" />

    <title>TMDB - Buscador de pel·lícules</title>
  </head>

  <body>
    <header>
      <a href="index.html">
        <img
          height="25"
          src="https://www.themoviedb.org/assets/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg"
          alt="Logo TMDB"
        />
      </a>

      <nav>
        <ul>
          <li><a href="#buscador">Buscador</a></li>
          <li><a href="contacte.html">Contacte</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="buscador" class="buscador">
        <h1>BUSCAR una pel·lícula</h1>

        <p>Milions de títols, un sol cercador</p>

        <form method="get" action="https://www.themoviedb.org/search">
          <div>
            <input
              type="search"
              name="query"
              placeholder="Cerca una pel·lícula, per exemple: 'The Matrix'"
              required
            />

            <button type="submit">Cercar</button>
          </div>
        </form>
      </section>

      <section class="pelicules">
        <h2>Resultats</h2>

        <div class="resultats">
          <article class="targeta">
            <img
              src="https://s3.amazonaws.com/nightjarprod/content/uploads/sites/122/2024/01/22213211/DUNE2_VERT_Tsr_2764x4096_EM_REV3.jpg"
              alt="Dune: Part Two"
              width="185"
              height="250"
            />

            <h3>Dune: Part Two</h3>
            <p>2024</p>
          </article>

          <article class="targeta">
            <img
              src="https://upload.wikimedia.org/wikipedia/en/a/a1/Lord_Rings_Two_Towers.jpg"
              alt="The Lord of the Rings: The Two Towers"
              width="185"
              height="250"
            />

            <h3>The Lord of the Rings: The Two Towers</h3>
            <p>2002</p>
          </article>

          <article class="targeta">
            <img
              src="https://m.media-amazon.com/images/M/MV5BYmYwNGUwZWQtMTcyZC00ZjAxLThmZWEtMTY1OTIwZmI5YjBmXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg"
              alt="Spider-Man: Brand New Day"
              width="185"
              height="250"
            />

            <h3>Spider-Man: Brand New Day</h3>
            <p>2026</p>
          </article>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2026 The Movie Database - Maqueta de disseny</p>
    </footer>
  </body>
</html>
